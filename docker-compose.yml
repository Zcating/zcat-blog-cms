services:
  cms_pg:
    image: postgres:16.1-alpine
    hostname: cms_pg
    container_name: cms_pg
    restart: unless-stopped
    env_file:
      - .env.deploy
    ports:
      - '15400:5432'
    volumes:
      - cms_pg:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 2s
      retries: 20

  oss:
    image: rustfs/rustfs:1.0.0
    hostname: oss
    container_name: cms_oss
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - export RUSTFS_ACCESS_KEY="$$OSS_ACCESS_KEY" RUSTFS_SECRET_KEY="$$OSS_SECRET_KEY"; exec /entrypoint.sh "$$@"
      - sh
    command:
      - /data
    ports:
      - '19000:9000'
      - '127.0.0.1:19001:9001'
    env_file:
      - .env.deploy
    volumes:
      - oss_data:/data
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: backend
    image: cms_backend:latest
    container_name: cms_backend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - '9090:9090'
    env_file:
      - .env.deploy
      - apps/backend/.env.production
    depends_on:
      cms_pg:
        condition: service_healthy
      oss:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: frontend
    image: cms_frontend:latest
    container_name: cms_frontend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - '3000:3000'
    env_file:
      - .env.deploy
    networks:
      - app-network

  blog:
    build:
      context: .
      dockerfile: Dockerfile.blog
      target: blog
    image: ${DOCKER_REGISTRY}cms_blog:latest
    container_name: blog
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env.deploy
    ports:
      - '1024:1024'
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  cms_pg:
  oss_data:
