services:
  cms_pg:
    image: postgres:16.1-alpine
    hostname: cms_pg
    container_name: cms_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:15400:5432'
    volumes:
      - cms_pg:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 2s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: backend
    image: ${DOCKER_REGISTRY}cms_backend:latest
    container_name: cms_backend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - '9090:9090'
    environment:
      ENV: ${ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_BUCKET: ${OSS_BUCKET}
    depends_on:
      cms_pg:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: frontend
    image: ${DOCKER_REGISTRY}cms_frontend:latest
    container_name: cms_frontend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - '3000:3000'
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
    networks:
      - app-network

  blog:
    build:
      context: .
      dockerfile: Dockerfile.blog
      target: blog
    image: ${DOCKER_REGISTRY}cms_blog:latest
    container_name: blog
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
      BLOG_SITE_URL: ${BLOG_SITE_URL}
    ports:
      - '1024:1024'
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  cms_pg:
