services:
  cms_pg:
    image: postgres:16.1-alpine
    hostname: cms_pg
    container_name: cms_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '15400:5432'
    volumes:
      - cms_pg:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 2s
      retries: 20

  oss:
    image: rustfs/rustfs:1.0.0
    hostname: oss
    container_name: cms_oss
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - export RUSTFS_ACCESS_KEY="$$OSS_ACCESS_KEY" RUSTFS_SECRET_KEY="$$OSS_SECRET_KEY"; exec /entrypoint.sh "$$@"
      - sh
    command:
      - /data
    ports:
      - '19000:9000'
      - '127.0.0.1:19001:9001'
    environment:
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
    volumes:
      - oss_data:/data
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: backend
    image: cms_backend:latest
    container_name: cms_backend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - '9090:9090'
    environment:
      ENV: ${ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_PORT: ${OSS_PORT}
      OSS_USE_SSL: ${OSS_USE_SSL}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY}
      OSS_PUBLIC_URL: ${OSS_PUBLIC_URL}
      OSS_BUCKET: ${OSS_BUCKET}
    depends_on:
      cms_pg:
        condition: service_healthy
      oss:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: frontend
    image: cms_frontend:latest
    container_name: cms_frontend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - '3000:3000'
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
    networks:
      - app-network

  blog:
    build:
      context: .
      dockerfile: Dockerfile.blog
      target: blog
    image: ${DOCKER_REGISTRY}cms_blog:latest
    container_name: blog
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
    ports:
      - '1024:1024'
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  cms_pg:
  oss_data:
