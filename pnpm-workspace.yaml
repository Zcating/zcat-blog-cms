packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@prisma/engines': set this to true or false
  '@swc/core': set this to true or false
  bcrypt: set this to true or false
  core-js: set this to true or false
  cpu-features: set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  ssh2: set this to true or false

# injectWorkspacePackages: true
# syncInjectedDepsAfterScripts:
#   - build
#   - dist

ignoredBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - bcrypt
  - core-js
  - esbuild
  - prisma
  - unrs-resolver
